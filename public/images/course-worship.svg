<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="careGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24070C" />
      <stop offset="50%" stop-color="#46131C" />
      <stop offset="100%" stop-color="#6B1F2B" />
    </linearGradient>
    <linearGradient id="warmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="50%" stop-color="#E5AA50" />
      <stop offset="100%" stop-color="#A56E24" />
    </linearGradient>
    <pattern id="oliveBranch" width="50" height="50" patternUnits="userSpaceOnUse">
      <ellipse cx="25" cy="25" rx="8" ry="4" transform="rotate(-30 25 25)" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#careGrad)"/>
  <rect width="800" height="450" fill="url(#oliveBranch)"/>

  <!-- Peaceful Valley Rolling Hills Silhouette -->
  <path d="M 0 320 Q 200 270 400 310 T 800 290 L 800 450 L 0 450 Z" fill="rgba(18, 4, 7, 0.45)"/>
  <path d="M 0 350 Q 300 310 600 350 T 800 340 L 800 450 L 0 450 Z" fill="rgba(18, 4, 7, 0.65)"/>

  <!-- Compassionate Shepherding & Care Central Iconography -->
  <g transform="translate(400, 185)">
    <!-- Halo of Compassion -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(229,170,80,0.18)" stroke-width="1.5" stroke-dasharray="8,6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="rgba(229,170,80,0.28)" stroke-width="2"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="rgba(229,170,80,0.38)" stroke-width="1.5"/>

    <!-- Shepherd's Staff (Crook) -->
    <path d="M 25 130 V -30 C 25 -80 -35 -80 -35 -40 C -35 -20 -15 -20 -15 -35 C -15 -50 5 -50 5 -30 V 130" 
          fill="none" stroke="url(#warmGold)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Healing Oil Vessel / Anointing Flask -->
    <g transform="translate(-40, 25)">
      <path d="M -15 25 C -25 25 -30 10 -25 -5 L -20 -25 L -10 -25 L -5 -5 C 0 10 -5 25 -15 25 Z" fill="#FAF6EE" stroke="url(#warmGold)" stroke-width="2"/>
      <ellipse cx="-15" cy="-25" rx="5" ry="2" fill="url(#warmGold)"/>
      <!-- Drop of healing oil -->
      <circle cx="-15" cy="5" r="3" fill="url(#warmGold)"/>
    </g>

    <!-- Olive Branch (Peace & Reconciliation) -->
    <path d="M -30 70 Q 0 40 45 60" fill="none" stroke="url(#warmGold)" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="-15" cy="50" rx="9" ry="4" transform="rotate(-25 -15 50)" fill="#FAF6EE" opacity="0.85"/>
    <ellipse cx="10" cy="46" rx="9" ry="4" transform="rotate(20 10 46)" fill="#FAF6EE" opacity="0.85"/>
    <ellipse cx="32" cy="55" rx="9" ry="4" transform="rotate(-15 32 55)" fill="#FAF6EE" opacity="0.85"/>

    <!-- Latin Cross Radiating Comfort -->
    <path d="M 0 -135 V -95 M -14 -120 H 14" stroke="url(#warmGold)" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Bottom Dark Banner Overlay with Clean Badge -->
  <rect y="365" width="800" height="85" fill="rgba(24, 6, 10, 0.92)"/>
  <line x1="0" y1="365" x2="800" y2="365" stroke="url(#warmGold)" stroke-width="2"/>
  
  <text x="35" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">PASTORAL CARE &amp; SHEPHERDING</text>
  <text x="35" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E5AA50" letter-spacing="1.5">CARE 202 • COUNSELING &amp; SHEPHERDING • AY2026-T5</text>
  
  <g transform="translate(705, 390)">
    <rect x="-15" y="-14" width="82" height="30" rx="15" fill="rgba(229,170,80,0.18)" stroke="#E5AA50" stroke-width="1"/>
    <text x="26" y="5" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFF2D6" text-anchor="middle">COMPLETED</text>
  </g>
</svg>
