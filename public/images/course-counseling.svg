<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="preachGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111D" />
      <stop offset="50%" stop-color="#12233D" />
      <stop offset="100%" stop-color="#1E3963" />
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE7BA" />
      <stop offset="50%" stop-color="#D49B43" />
      <stop offset="100%" stop-color="#935E18" />
    </linearGradient>
    <pattern id="soundWave" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="18" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#preachGrad)"/>
  <rect width="800" height="450" fill="url(#soundWave)"/>

  <!-- Proclamation Radiant Sound Waves -->
  <g transform="translate(400, 180)">
    <circle cx="0" cy="0" r="170" fill="none" stroke="rgba(212,155,67,0.12)" stroke-width="1.5" stroke-dasharray="10,8"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="rgba(212,155,67,0.2)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="100" fill="none" stroke="rgba(212,155,67,0.28)" stroke-width="2"/>

    <!-- Light of the Word -->
    <polygon points="0,-160 -120,160 120,160" fill="rgba(255,231,186,0.06)"/>

    <!-- The Pulpit & Open Scripture Lectern -->
    <!-- Lectern Angled Top -->
    <polygon points="-80,20 80,20 65,-20 -65,-20" fill="#FAF6EE" stroke="url(#bronzeGrad)" stroke-width="2.5"/>
    <!-- Cross on Lectern Face -->
    <path d="M 0 35 V 95 M -18 52 H 18" stroke="url(#bronzeGrad)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Lectern Column & Base -->
    <rect x="-24" y="20" width="48" height="110" fill="#152B4D" stroke="url(#bronzeGrad)" stroke-width="2"/>
    <rect x="-60" y="130" width="120" height="18" rx="3" fill="#0C1B30" stroke="url(#bronzeGrad)" stroke-width="2"/>

    <!-- Open Scroll / Manuscript on Lectern -->
    <g transform="translate(0, -25)">
      <!-- Scroll Left Roll -->
      <ellipse cx="-45" cy="0" rx="8" ry="16" fill="url(#bronzeGrad)"/>
      <!-- Scroll Body -->
      <rect x="-45" y="-16" width="90" height="32" fill="#FAF5E8"/>
      <!-- Scroll Right Roll -->
      <ellipse cx="45" cy="0" rx="8" ry="16" fill="url(#bronzeGrad)"/>
      <ellipse cx="45" cy="0" rx="6" ry="13" fill="#D49B43"/>
      <!-- Text markings on scroll -->
      <line x1="-30" y1="-7" x2="30" y2="-7" stroke="#0B1526" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="-30" y1="0" x2="25" y2="0" stroke="#0B1526" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
      <line x1="-30" y1="7" x2="28" y2="7" stroke="#0B1526" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Heraldic Stars (Truth & Grace) -->
    <polygon points="-120,-60 -115,-48 -103,-48 -112,-40 -108,-28 -120,-36 -132,-28 -128,-40 -137,-48 -125,-48" fill="url(#bronzeGrad)" opacity="0.7"/>
    <polygon points="120,-60 125,-48 137,-48 128,-40 132,-28 120,-36 108,-28 112,-40 103,-48 115,-48" fill="url(#bronzeGrad)" opacity="0.7"/>
  </g>

  <!-- Bottom Dark Banner Overlay with Clean Badge -->
  <rect y="365" width="800" height="85" fill="rgba(8, 17, 29, 0.92)"/>
  <line x1="0" y1="365" x2="800" y2="365" stroke="url(#bronzeGrad)" stroke-width="2"/>
  
  <text x="35" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">EXPOSITORY PREACHING &amp; HOMILETICS</text>
  <text x="35" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#D49B43" letter-spacing="1.5">PRCH 301 • FAITHFUL PROCLAMATION • AY2026-T5</text>
  
  <g transform="translate(705, 390)">
    <rect x="-15" y="-14" width="82" height="30" rx="15" fill="rgba(212,155,67,0.18)" stroke="#D49B43" stroke-width="1"/>
    <text x="26" y="5" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFE7BA" text-anchor="middle">COMPLETED</text>
  </g>
</svg>
