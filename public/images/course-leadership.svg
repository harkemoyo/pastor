<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="churchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091E16" />
      <stop offset="50%" stop-color="#143D2F" />
      <stop offset="100%" stop-color="#235A46" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="50%" stop-color="#E2B755" />
      <stop offset="100%" stop-color="#A57A1E" />
    </linearGradient>
    <pattern id="archGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0 60 A 30 30 0 0 1 60 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#churchGrad)"/>
  <rect width="800" height="450" fill="url(#archGrid)"/>

  <!-- Architectural Canopy / Church Sanctuary Outline -->
  <g transform="translate(400, 200)">
    <!-- Sanctuary Central Arch -->
    <path d="M -180 140 V 20 C -180 -100 180 -100 180 20 V 140" fill="none" stroke="rgba(226,183,85,0.25)" stroke-width="2"/>
    <path d="M -140 140 V 30 C -140 -70 140 -70 140 30 V 140" fill="none" stroke="rgba(226,183,85,0.35)" stroke-width="2"/>
    <path d="M -90 140 V 45 C -90 -35 90 -35 90 45 V 140" fill="none" stroke="rgba(226,183,85,0.5)" stroke-width="2.5"/>

    <!-- Pillar Columns (Greek/Doric Classical Church Foundation) -->
    <!-- Col 1 -->
    <rect x="-195" y="40" width="22" height="100" rx="3" fill="#FAF6EE" opacity="0.85"/>
    <rect x="-202" y="32" width="36" height="8" rx="2" fill="url(#goldGrad2)"/>
    <rect x="-202" y="140" width="36" height="10" rx="2" fill="url(#goldGrad2)"/>

    <!-- Col 2 -->
    <rect x="-105" y="40" width="22" height="100" rx="3" fill="#FAF6EE" opacity="0.85"/>
    <rect x="-112" y="32" width="36" height="8" rx="2" fill="url(#goldGrad2)"/>
    <rect x="-112" y="140" width="36" height="10" rx="2" fill="url(#goldGrad2)"/>

    <!-- Col 3 -->
    <rect x="83" y="40" width="22" height="100" rx="3" fill="#FAF6EE" opacity="0.85"/>
    <rect x="76" y="32" width="36" height="8" rx="2" fill="url(#goldGrad2)"/>
    <rect x="76" y="140" width="36" height="10" rx="2" fill="url(#goldGrad2)"/>

    <!-- Col 4 -->
    <rect x="173" y="40" width="22" height="100" rx="3" fill="#FAF6EE" opacity="0.85"/>
    <rect x="166" y="32" width="36" height="8" rx="2" fill="url(#goldGrad2)"/>
    <rect x="166" y="140" width="36" height="10" rx="2" fill="url(#goldGrad2)"/>

    <!-- Arch Keystone & Cross -->
    <polygon points="0,-120 -18,-95 18,-95" fill="url(#goldGrad2)"/>
    <path d="M 0 -160 V -115 M -15 -145 H 15" stroke="url(#goldGrad2)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Center Fellowship Icon: Shield with 3 People Gathering Under Cross -->
    <circle cx="0" cy="80" r="42" fill="#0C271E" stroke="url(#goldGrad2)" stroke-width="2.5"/>
    <!-- Leader / Pastor in center -->
    <circle cx="0" cy="65" r="9" fill="#FAF6EE"/>
    <path d="M -15 98 C -15 80 15 80 15 98" fill="#FAF6EE"/>
    <!-- Member left -->
    <circle cx="-20" cy="74" r="6" fill="#D4A843"/>
    <path d="M -30 98 C -30 86 -10 86 -10 98" fill="#D4A843"/>
    <!-- Member right -->
    <circle cx="20" cy="74" r="6" fill="#D4A843"/>
    <path d="M 10 98 C 10 86 30 86 30 98" fill="#D4A843"/>
  </g>

  <!-- Bottom Dark Banner Overlay with Clean Badge -->
  <rect y="365" width="800" height="85" fill="rgba(8, 22, 16, 0.90)"/>
  <line x1="0" y1="365" x2="800" y2="365" stroke="url(#goldGrad2)" stroke-width="2"/>
  
  <text x="35" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.8">BUILDING A HEALTHY CHURCH</text>
  <text x="35" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2B755" letter-spacing="1.5">CHUR 201 • ECCLESIOLOGY &amp; LEADERSHIP • AY2027-T1</text>
  
  <g transform="translate(710, 390)">
    <rect x="-15" y="-14" width="75" height="30" rx="15" fill="rgba(226,183,85,0.2)" stroke="#E2B755" stroke-width="1"/>
    <text x="22" y="5" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFEAA7" text-anchor="middle">ACTIVE</text>
  </g>
</svg>
